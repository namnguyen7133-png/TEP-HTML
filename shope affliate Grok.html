function loadSample() {
  document.getElementById('csvInput').value = SAMPLE_CSV;
  analyze();
}

function analyze() {
  const raw = document.getElementById('csvInput').value.trim();
  if (!raw) { alert("Chưa có dữ liệu CSV!"); return; }

  // Tách dòng thông minh (hỗ trợ xuống dòng trong ngoặc kép)
  const lines = raw.split(/\r?\n/);
  if (lines.length < 2) { alert("CSV không hợp lệ!"); return; }

  const rows = lines.slice(1).map(line => {
    // Regex tách CSV có xử lý ngoặc kép
    const regex = /(".*?"|[^",]+)(?=\s*,|\s*$)/g;
    return line.match(regex)?.map(s => s.replace(/^"|"$/g, '').trim()) || [];
  }).filter(r => r.length >= 5);

  const data = rows.map(r => ({
    name: r[0],
    time: r[1].replace(/[\r\n]/g, ' '),
    rate: parseFloat(r[2]) || 0,
    link: r[3],
    track: r[4]
  }));

  // Phân loại
  const high = data.filter(x => x.rate >= 12);
  const medium = data.filter(x => x.rate >= 8 && x.rate < 12);
  const low = data.filter(x => x.rate < 8);

  let html = `<h3>Kết quả phân tích (${data.length} shop)</h3>`;

  html += section("Hoa hồng cực cao (≥12%) – ĐẨY MẠNH NGAY!", high, "high");
  html += section("Mức khá tốt (8–11%) – Dễ ra đơn, chạy ổn định", medium, "medium");
  html += section("Thấp (<8%) – Chỉ chạy khi ngách hẹp hoặc thử nghiệm", low, "low");

  document.getElementById('result').innerHTML = html;
}

function section(title, arr, cls) {
  if (arr.length === 0) return `<p><em>Không có shop nào trong nhóm này</em></p>`;
  let t = `<div class="section ${cls}"><h3>${title} <span class="count">${arr.length} shop</span></h3>`;
  t += `<table><tr><th>Tên Shop</th><th>Hoa hồng</th><th>Thời gian</th><th>Link Shop</th><th>Tracking Link</th></tr>`;
  arr.forEach(x => {
    t += `<tr>
      <td><strong>${x.name}</strong></td>
      <td><strong style="color:#e91e63">${x.rate}%</strong></td>
      <td>${x.time}</td>
      <td><a href="${x.link}" target="_blank">Mở Shop</a></td>
      <td><a href="${x.track}" target="_blank">Tracking</a></td>
    </tr>`;
  });
  t += `</table></div>`;
  return t;
}
